name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        anki: ["26.8.1", "26.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest anki==${{ matrix.anki }} aqt==${{ matrix.anki }}
      - run: python -m pytest -q
      - run: python build.py
